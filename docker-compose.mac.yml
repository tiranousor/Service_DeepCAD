services:
  text2cad:
    image: tiranousor/deepcad:latest
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - PYTHONPATH=/workspace:/app:/app/CadGen:/app/DeepCAD:/app/DeepCAD/CadGen
      - TEXT2CAD_OUTPUT_DIR=/workspace/generated_steps
    ports:
      - "8000:8000"
    command: python -m uvicorn main_text_service:app --host 0.0.0.0 --port 8000
